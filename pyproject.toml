[project]
name = "musicom"
version = "1.0.0"
description = "Music composition, production and analysis library (educational; ships with a Hermes-agent skill)"
readme = "README.md"
dependencies = [
    "numpy",
    "mido",
    "scipy",
    "music21",
    "networkx",
    "pandas",
    "matplotlib"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Flat layout: each top-level dir is its own importable package.
# Matches examples (`from workflows...`, `from structures...`).
[tool.setuptools.packages.find]
where = ["."]
include = [
    "analysis*", "converters*", "generators*", "rules*",
    "sound*", "structures*", "transformers*", "utilities*", "visualization*",
    "workflows*", "legacy*",
]
exclude = ["musicom*", "tests*", "examples*", "projects*", "research*"]
