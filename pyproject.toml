[project]
name = "musicom"
version = "0.1.0"
description = "Music Composition Library"
dependencies = [
    "numpy",
    "mido",
    "scipy",
    "music21",
    "networkx",
    "pandas",
    "matplotlib"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["musicom*"]
